$kind: http-request
description: '`"lat,lon"` input is parsed locally, no geocoding call.'
url: "{{baseUrl}}/api/trip/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "start": "32.7767,-96.797",
      "finish": "Houston, TX"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Start label echoes the coordinates", () => pm.expect(pm.response.json().start.label).to.eql("32.7767, -96.797"));
    language: text/javascript
order: 5000
