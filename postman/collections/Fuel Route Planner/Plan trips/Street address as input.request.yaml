$kind: http-request
description: Street addresses fall back to Nominatim geocoding (one extra external call).
url: "{{baseUrl}}/api/trip/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "start": "1600 Pennsylvania Ave NW, Washington, DC",
      "finish": "Baltimore, MD"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Short trip needs no fuel stops on a full tank", () => pm.expect(pm.response.json().fuel_stops).to.be.empty);
    language: text/javascript
order: 6000
