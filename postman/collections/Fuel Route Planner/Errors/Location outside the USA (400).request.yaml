$kind: http-request
url: "{{baseUrl}}/api/trip/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "start": "51.5,-0.12",
      "finish": "Albany, NY"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Explains the problem", () => pm.expect(pm.response.json().detail).to.include("outside the USA"));
    language: text/javascript
order: 3000
