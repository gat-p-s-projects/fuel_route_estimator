$kind: http-request
url: "{{baseUrl}}/api/trip/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "start": "Boston, MA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Names the missing field", () => pm.expect(pm.response.json()).to.have.property("finish"));
    language: text/javascript
order: 1000
